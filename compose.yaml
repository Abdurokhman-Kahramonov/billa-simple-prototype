services:
  postgres:
    image: 'postgres:17'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5433:5432'
  redis:
    image: 'redis:7.4'
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '6380:6379'
