spring.application.name=loadTestBilla

spring.datasource.url=jdbc:postgresql://localhost:5433/mydatabase
spring.datasource.username=myuser
spring.datasource.password=secret
spring.datasource.driver-class-name=org.postgresql.Driver
# The connection pool is the first thing a load test usually exhausts. Change it and watch
# hikaricp_connections_pending on /actuator/prometheus.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000

server.port=8081

spring.data.redis.host=localhost
spring.data.redis.port=6380
spring.data.redis.timeout=2s
# Redis is used directly (scripts, keys, pub/sub), never as a Spring Data repository store.
spring.data.redis.repositories.enabled=false

spring.jpa.hibernate.ddl-auto=update
# Keep SQL logging off: printing every statement under load measures the console, not the server.
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Spring's default scheduler has ONE thread. The matchmaker, the countdowns and the sweeper share it,
# so one slow task would delay all the others (Billa learned this the hard way).
spring.task.scheduling.pool.size=4

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
# Bucketed histograms, so p95/p99 can be computed from /actuator/prometheus.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.game.ws.dispatch=true
management.metrics.distribution.percentiles-histogram.game.queue.wait=true
management.metrics.distribution.percentiles-histogram.hikaricp.connections.acquire=true
management.metrics.distribution.percentiles-histogram.game.redis.script=true
management.metrics.distribution.percentiles-histogram.lettuce=true

# ---- Cluster ----
# Each running instance needs its own id; run two with --game.instance-id=a and --game.instance-id=b.
game.instance-id=${random.uuid}
# How long Redis remembers which instance holds a player's socket without hearing from that instance.
game.session-ttl=30s
# How often each instance refreshes its sockets' keys. Must be well under session-ttl.
game.session-heartbeat=10s

# ---- Game rules ----
# Reps needed to win a first-to-X match.
game.target-reps=10
# A rep that arrives sooner than this after the player's previous one is rejected "too-fast".
game.min-rep-interval=250ms
# Both players READY -> MATCH_STARTED after this countdown.
game.countdown=3s
# A match nobody got ready for is cancelled after this.
game.ready-timeout=2m
# A started match still running after this is ended as TIMEOUT (more reps wins).
game.max-match-duration=2m
# How often the matchmaker pairs queued players.
game.matchmaking-interval=100ms
game.win-xp=100
game.loss-xp=20
game.draw-xp=50
# Extra database work on registration (pg_sleep), in milliseconds. 0 = off.
# Raise it to make the connection pool the bottleneck on purpose.
game.registration-db-delay-ms=0
